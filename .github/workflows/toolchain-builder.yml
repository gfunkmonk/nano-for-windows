name: Toolchain Builder

on:
  schedule:
    - cron: '51 10 * * SAT'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Debug session enabled'
        required: false
        default: false
        type: boolean
      skip_unchanged:
        description: 'Skip build if LLVM-MinGW upstream unchanged'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ## PRECHECK ##############################################################################
  precheck:
    name: "✅ Pre-build check"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      rev: ${{ steps.check.outputs.rev }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
    - name: "🔍 Check if LLVM-MinGW upstream changed"
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_DEBUG: ${{ github.event.inputs.debug_enabled }}
        INPUT_SKIP_UNCHANGED: ${{ github.event.inputs.skip_unchanged }}
      run: |
        # Use the upstream HEAD SHA as cache key so the cache is
        # invalidated whenever llvm-mingw is updated, not every run.
        REV=$(git ls-remote https://github.com/mstorsjo/llvm-mingw.git HEAD | cut -f1)
        echo "rev=${REV}" >> "$GITHUB_OUTPUT"
        echo "LLVM-MinGW HEAD: ${REV}"

        # A ccache entry keyed on this rev only exists if we've already
        # built it successfully before. If so, and nobody explicitly asked
        # for a debug session or a forced rebuild, skip the (expensive)
        # build job entirely instead of just cache-accelerating it.
        if [[ "${INPUT_DEBUG}" == "true" ]]; then
          echo "Debug session requested — build will not be skipped."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        elif [[ "${INPUT_SKIP_UNCHANGED}" == "false" ]]; then
          echo "Force build requested — skipping upstream change check."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          EXISTING=$(gh api "repos/${{ github.repository }}/actions/caches?key=ccache-llvm-${REV}" --jq '.actions_caches | length' 2>/dev/null || echo 0)
          if [ "${EXISTING}" -gt 0 ]; then
            echo "LLVM-MinGW unchanged since last successful build. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        fi

  ## BUILD ##############################################################################
  build:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    name: Builds toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 225
    container:
      image: alpine:edge
      options: --user root
    permissions:
      actions: write
    env:
      # Use all available cores and setup ccache path
      MAKEFLAGS: "-j$(nproc)"
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - name: "⏬ Install Base Dependencies"
      shell: sh
      run: |
        apk update && apk upgrade
        apk add git bash curl jq tar build-base python3 cmake linux-headers coreutils perl openssh-client xz ccache ninja
        mkdir -p $HOME/.local/bin
        echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV
        git config --global --add safe.directory '*'

    - name: "🕐 Reuse LLVM-MinGW commit hash from precheck"
      id: llvm-rev
      shell: bash
      run: echo "rev=${{ needs.precheck.outputs.rev }}" >> "$GITHUB_OUTPUT"

    - name: "🔧 Prepare debug session"
      if: github.event.inputs.debug_enabled == 'true'
      shell: bash
      run: |
        apk add nano iproute2 util-linux
        curl -fsSL -o /usr/local/bin/oh-my-posh https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest/download/posh-linux-amd64
        chmod +x /usr/local/bin/oh-my-posh
        echo 'eval "$(oh-my-posh init bash)"' >> ~/.bashrc

    - name: "🐞 Debug session"
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.debug_enabled == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "💾 Restore ccache"
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-llvm-${{ steps.llvm-rev.outputs.rev }}
        restore-keys: |
          ccache-llvm-

    - name: "⚙️ Build LLVM-MinGW Master"
      shell: bash
      run: |
        # Create ccache symlinks for Alpine if they don't exist
        # This ensures 'gcc' actually points to 'ccache'
        mkdir -p $HOME/.local/bin
        ln -sf /usr/bin/ccache $HOME/.local/bin/gcc
        ln -sf /usr/bin/ccache $HOME/.local/bin/g++
        ln -sf /usr/bin/ccache $HOME/.local/bin/cc
        ln -sf /usr/bin/ccache $HOME/.local/bin/c++

        # Ensure our local bin is at the front of the PATH
        export PATH="$HOME/.local/bin:$PATH"

        # Verify ccache is active
        which gcc # Should return /root/.local/bin/gcc

        export MAKEFLAGS="-j$(nproc)"

        echo "Using SHELL: $SHELL"
        if [ ! -d "llvm" ]; then
          git clone --depth 1 https://github.com/mstorsjo/llvm-mingw.git llvm
        fi
        cd llvm
        mkdir -p ../llvm-mingw
        ./build-all.sh ../llvm-mingw

    - name: "🚮 Delete stale caches"
      # Only prune old caches after a successful fresh build.
      if: success()
      uses: snnaplab/delete-branch-cache-action@v1

    - name: "📦 Upload Toolchain Artifact"
      # Make the toolchain available as a downloadable artifact in addition
      # to the cache, so other workflows can fetch it via download-artifact.
      uses: actions/upload-artifact@v7
      with:
        name: llvm-mingw
        path: llvm-mingw
        retention-days: 9

